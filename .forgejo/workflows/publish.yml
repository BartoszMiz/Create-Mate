name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: java
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check mod version
        run: |
          MOD_VERSION="$(grep mod_version gradle.properties | cut -d '=' -f 2)"
          if [ "${{ github.ref_name }}" == "v$MOD_VERSION" ]; then
            echo "The tag matches the mod version - good job!"
          else
            echo "The mod version specified in gradle.properties ($MOD_VERSION) does not match the tag number ${{ github.ref_name }}"
            exit 1
          fi

#      - name: Setup JDK 21
#        uses: actions/setup-java@v5
#        with:
#          java-version: '21'
#          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify DataGen
        run: |
          ./gradlew runData
          if git diff --quiet src/generated; then
            echo "All DataGen is correctly commited!"
          else
            echo 'The DataGen output does not match what is committed. Please run `./gradlew runData` locally and commit the results. You may need to remove the `src/generated/resources/.cache` directory.'
            exit 1
          fi

      - name: Build with Gradle
        run: ./gradlew build

      - name: Create Release
        uses: actions/forgejo-release@v2.13.4
        with:
          direction: upload
          release-dir: build/libs
          override: true
